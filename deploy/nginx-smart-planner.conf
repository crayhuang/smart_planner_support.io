server {
    listen 80;
    listen [::]:80;
    server_name support.example.com;

    root /var/www/smart-planner;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|jpg|jpeg|png|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}

